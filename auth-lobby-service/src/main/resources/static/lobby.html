<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codenames - Lobbys</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container lobby-size">
    <button class="btn-auto btn-danger" id="logout-btn">Logout</button>
    <h2>Offene Lobbys</h2>

    <div id="lobby-list">
        <!-- Lobbys werden hier per JavaScript generiert -->
    </div>

    <div class="create-section">
        <h3>Neue Lobby erstellen</h3>
        <input type="text" id="new-lobby-name" placeholder="Lobby Name" required>
        <select id="new-lobby-mode">
            <option value="CLASSIC">Classic</option>
            <option value="DUET">Duett</option>
        </select>
        <button id="create-btn">Erstellen</button>
    </div>
</div>

<script>
    // --- MOCK DATEN (Später durch fetch() ersetzen) ---
    let mockLobbies = [
        { id: 1, name: "Freitagsrunde", status: "OPEN", gameMode: "CLASSIC" },
        { id: 2, name: "Profis only", status: "OPEN", gameMode: "DUET" }
    ];

    const lobbyListContainer = document.getElementById('lobby-list');
    const createBtn = document.getElementById('create-btn');
    const logoutBtn = document.getElementById('logout-btn');

    function renderLobbies() {
        lobbyListContainer.innerHTML = '';

        if (mockLobbies.length === 0) {
            lobbyListContainer.innerHTML = '<p>Aktuell keine offenen Lobbys.</p>';
            return;
        }

        mockLobbies.forEach(lobby => {
            const div = document.createElement('div');
            div.className = 'lobby-item';
            div.innerHTML = `
                <div>
                    <strong>${lobby.name}</strong><br>
                    <small>Modus: ${lobby.gameMode}</small>
                </div>
                <button onclick="joinLobby(${lobby.id})">Beitreten</button>
            `;
            lobbyListContainer.appendChild(div);
        });
    }

    // Lobby beitreten (Mock)
    window.joinLobby = function(id) {
        console.log(`Beitreten zu Lobby ID: ${id}`);
        alert(`Du würdest jetzt Lobby ${id} beitreten. Hier folgt später der Wechsel auf das Spielfeld.`);
        // Später: fetch('/api/lobbies/' + id + '/join', { method: 'POST' ... })
    };

    // Lobby erstellen (Mock)
    createBtn.addEventListener('click', () => {
        const name = document.getElementById('new-lobby-name').value;
        const gameMode = document.getElementById('new-lobby-mode').value;

        if (!name) {
            alert("Bitte einen Namen eingeben.");
            return;
        }

        const newLobby = {
            id: Date.now(), // Temporäre Dummy-ID
            name: name,
            status: "OPEN",
            gameMode: gameMode
        };

        mockLobbies.push(newLobby);
        renderLobbies();
        document.getElementById('new-lobby-name').value = '';

        // Später: fetch('/api/lobbies', { method: 'POST', body: JSON.stringify({name, gameMode}) ... })
    });

    // Logout Dummy
    logoutBtn.addEventListener('click', () => {
        // Später: fetch('/api/auth/signout', { method: 'POST' ... })
        window.location.href = "index.html";
    });

    renderLobbies();

</script>

</body>
</html>
