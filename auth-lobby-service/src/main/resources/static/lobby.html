<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codenames - Lobbys</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container lobby-size">
    <button class="btn-auto btn-danger" id="logout-btn">Logout</button>
    <h2 class="lobby-header">Offene Lobbys</h2>

    <div id="lobby-list">
        Lade Lobbys...
    </div>

    <div class="create-section">
        <h3>Neue Lobby erstellen</h3>
        <input type="text" id="new-lobby-name" placeholder="Lobby Name" required>
        <select id="new-lobby-mode">
            <option value="CLASSIC">Classic</option>
            <option value="DUET">Duett</option>
        </select>
        <button id="create-btn">Erstellen</button>
    </div>
</div>

<script>
    const lobbyListContainer = document.getElementById('lobby-list');
    const createBtn = document.getElementById('create-btn');
    const logoutBtn = document.getElementById('logout-btn');

    // Token aus dem Login überprüfen
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = "index.html"; // Zurück zum Login, falls kein Token existiert
    }

    // --- ECHTE DATEN LADEN ---
    async function loadLobbies() {
        try {
            const res = await fetch('http://localhost:8081/api/lobbies', {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                const lobbies = await res.json();
                renderLobbies(lobbies);
            } else {
                lobbyListContainer.innerHTML = '<p style="color: red;">Fehler beim Laden der Lobbys.</p>';
            }
        } catch (err) {
            console.error("Netzwerkfehler:", err);
            lobbyListContainer.innerHTML = '<p style="color: red;">Backend nicht erreichbar.</p>';
        }
    }

    // --- UI RENDERN ---
    function renderLobbies(lobbies) {
        lobbyListContainer.innerHTML = '';

        if (lobbies.length === 0) {
            lobbyListContainer.innerHTML = '<p>Aktuell keine offenen Lobbys.</p>';
            return;
        }

        lobbies.forEach(lobby => {
            const div = document.createElement('div');
            div.className = 'lobby-item';
            div.innerHTML = `
                <div>
                    <strong>${lobby.name}</strong><br>
                    <small>Modus: ${lobby.gameMode}</small>
                </div>
                <button onclick="joinLobby(${lobby.id})">Beitreten</button>
            `;
            lobbyListContainer.appendChild(div);
        });
    }

    // --- LOBBY BEITRETEN ---
    window.joinLobby = async function(id) {
        // ID für den Warteraum merken
        localStorage.setItem('currentLobbyId', id);

        try {
            const res = await fetch(`http://localhost:8081/api/lobbies/${id}/join`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.ok) {
                window.location.href = "lobby-room.html";
            } else {
                alert("Fehler beim Beitreten der Lobby. Womöglich bist du bereits beigetreten.");
            }
        } catch (err) {
            console.error(err);
        }
    };

    // --- LOBBY ERSTELLEN ---
    createBtn.addEventListener('click', async () => {
        const name = document.getElementById('new-lobby-name').value;
        const gameMode = document.getElementById('new-lobby-mode').value;

        if (!name) {
            alert("Bitte einen Namen eingeben.");
            return;
        }

        try {
            const res = await fetch('http://localhost:8081/api/lobbies', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name: name, gameMode: gameMode })
            });

            if (res.ok) {
                document.getElementById('new-lobby-name').value = '';
                loadLobbies(); // Liste sofort aktualisieren
            } else {
                alert("Fehler beim Erstellen. Ist der Name evtl. schon vergeben?");
            }
        } catch (err) {
            console.error(err);
        }
    });

    // --- LOGOUT ---
    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('token');
        localStorage.removeItem('userId');
        window.location.href = "index.html";
    });

    // Initiales Laden
    loadLobbies();

    // Automatisches Neuladen alle 3 Sekunden
    setInterval(loadLobbies, 3000);

</script>

</body>
</html>
